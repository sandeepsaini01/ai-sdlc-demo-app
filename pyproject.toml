[project]
name = "invoice-approval"
version = "0.1.0"
description = "Invoice approval demo with role limits, implemented in Python."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.6",
  "uvicorn>=0.34.0",
  "pydantic>=2.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
